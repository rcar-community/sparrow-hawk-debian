CONFIG_MT76x0_COMMON=m
CONFIG_MT76x0U=m
CONFIG_MT76x2_COMMON=m
CONFIG_MT76x2U=m
CONFIG_ATH9K_HTC=m

# USB Bluetooth dongles
CONFIG_BT_HCIBTUSB=m
